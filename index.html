<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14132B">
<title>ITO｜数字ならべパーティーゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14132B;
    --bg-2:#1a1840;
    --panel:#1F1B3D;
    --panel-soft:#262050;
    --panel-soft-2:#2d2660;
    --line:#3a3370;
    --gold:#F4B942;
    --gold-deep:#d99c2a;
    --rose:#FF6B6B;
    --mint:#4ADE80;
    --text:#F5F3EE;
    --text-muted:#9C97C4;
    --cream:#FFF3DC;
    --ink:#241B3D;
    --ink-muted:rgba(36,27,61,.58);
    --amber-ink:#B5650A;
    --font-hero:'Reggae One',sans-serif;
    --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
    --font-mono:'Space Mono','SF Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 18%, rgba(244,185,66,.20) 0 3px, transparent 4px),
      radial-gradient(circle at 82% 12%, rgba(255,107,107,.16) 0 2.5px, transparent 3.5px),
      radial-gradient(circle at 62% 68%, rgba(74,222,128,.14) 0 2.5px, transparent 3.5px),
      radial-gradient(circle at 28% 84%, rgba(244,185,66,.16) 0 2px, transparent 3px),
      radial-gradient(circle at 92% 58%, rgba(255,255,255,.10) 0 2px, transparent 3px),
      radial-gradient(circle at 45% 40%, rgba(255,107,107,.10) 0 2px, transparent 3px),
      radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg) 60%);
    background-size:150px 150px,170px 170px,140px 140px,160px 160px,180px 180px,130px 130px,100% 100%;
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex-direction:column; gap:18px; flex:1; animation:fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
    *{ animation-duration:0.001s !important; transition-duration:0.001s !important; }
  }

  /* ---- generic ---- */
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.12em;
    color:var(--gold); text-transform:uppercase;
  }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.35; }
  h2{ font-size:19px; font-weight:700; }
  p{ margin:0; line-height:1.65; color:var(--text-muted); font-size:14.5px; }
  .card-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    padding:22px; display:flex; flex-direction:column; gap:14px;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:var(--font-display); font-weight:700; font-size:16px;
    border-radius:999px; padding:15px 20px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:50px; transition:transform .12s ease, opacity .2s ease;
    touch-action:manipulation;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--gold); color:#231a05; box-shadow:0 8px 20px rgba(244,185,66,.25); }
  .btn-ghost{ background:transparent; color:var(--text); border:1.5px solid var(--line); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  /* ---- hero logo ---- */
  .logo-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:6px 0 2px; position:relative; }
  .logo-wrap .mark{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); letter-spacing:.22em; }
  .confetti-dot{ position:absolute; border-radius:50%; }
  .confetti-star{ position:absolute; font-size:14px; color:var(--gold); }
  .logo-badge{
    position:relative;
    background:var(--cream); border-radius:16px; padding:10px 30px;
    transform:rotate(-2deg);
    box-shadow:0 12px 26px rgba(0,0,0,.4);
    border:2px dashed rgba(36,27,61,.25);
  }
  .logo-badge::before, .logo-badge::after{
    content:''; position:absolute; width:14px; height:14px; background:var(--bg);
    border-radius:50%; top:50%; transform:translateY(-50%);
  }
  .logo-badge::before{ left:-7px; }
  .logo-badge::after{ right:-7px; }
  .logo-badge h1{
    font-family:var(--font-hero); font-size:42px; letter-spacing:.08em; margin:0;
    display:flex; gap:2px;
  }
  .logo-badge .c1{ color:var(--gold-deep); }
  .logo-badge .c2{ color:var(--rose); }
  .logo-badge .c3{ color:#2a9d5c; }

  /* ---- global step progress bar ---- */
  #global-steps{ display:none; flex-direction:column; align-items:center; gap:8px; padding-bottom:4px; }
  .dots-row{ display:flex; align-items:center; width:100%; max-width:280px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; transition:background .2s,width .2s,height .2s; }
  .dot.active{ background:var(--gold); width:12px; height:12px; }
  .dot.done{ background:var(--gold-deep); }
  .step-line{ flex:1; height:2px; background:var(--line); }
  .step-line.done{ background:var(--gold-deep); }
  .step-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); letter-spacing:.04em; }

  /* ---- stepper (player count) ---- */
  .stepper{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .stepper button{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--panel-soft); color:var(--text); font-size:22px; font-family:var(--font-mono);
    cursor:pointer;
  }
  .stepper .count{ font-family:var(--font-mono); font-size:34px; font-weight:700; min-width:46px; text-align:center; }
  .stepper .count-label{ font-size:12px; color:var(--text-muted); text-align:center; margin-top:-8px; }

  /* ---- name inputs ---- */
  .name-list{ display:flex; flex-direction:column; gap:9px; }
  .name-row{ display:flex; align-items:center; gap:10px; }
  .name-row .num{ font-family:var(--font-mono); color:var(--gold); width:20px; text-align:right; font-size:13px; }
  .name-row input{
    flex:1; background:var(--panel-soft); border:1.5px solid var(--line); border-radius:12px;
    color:var(--text); font-family:var(--font-body); font-size:15px; padding:11px 14px;
  }
  .name-row input:focus{ outline:none; border-color:var(--gold); }

  /* ---- secret card (number reveal, ticket-stub motif) ---- */
  .secret-stage{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:4px 0; }
  .pass-name{ font-family:var(--font-display); font-size:19px; font-weight:700; text-align:center; }
  .secret-card{
    width:100%; aspect-ratio:4/3; border-radius:20px; position:relative;
    display:flex; cursor:pointer; overflow:visible;
    background:var(--cream);
    box-shadow:0 16px 32px rgba(0,0,0,.4);
  }
  .secret-card .stub{
    width:54px; flex:none; position:relative;
    border-right:2px dashed rgba(36,27,61,.22);
    display:flex; align-items:center; justify-content:center;
  }
  .secret-card .stub::before, .secret-card .stub::after{
    content:''; position:absolute; width:16px; height:16px; background:var(--bg); border-radius:50%; right:-8px;
  }
  .secret-card .stub::before{ top:-8px; }
  .secret-card .stub::after{ bottom:-8px; }
  .secret-card .stub-label{ writing-mode:vertical-rl; font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; color:var(--ink-muted); }
  .secret-card .main{
    flex:1; display:flex; align-items:center; justify-content:center; border-radius:0 18px 18px 0;
    background:repeating-linear-gradient(135deg, rgba(36,27,61,.05) 0 10px, rgba(36,27,61,.10) 10px 20px);
  }
  .secret-card.revealed .main{
    background:radial-gradient(circle at 50% 45%, rgba(244,185,66,.45), transparent 70%);
  }
  .secret-card .hint{ display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--ink-muted); }
  .secret-card .hint .icon{ font-size:34px; }
  .secret-card .hint .label{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); }
  .secret-number{
    font-family:var(--font-mono); font-weight:700; color:var(--amber-ink);
    font-size:clamp(54px, 18vw, 84px); letter-spacing:.05em; animation:pop .28s ease;
  }
  @keyframes pop{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .secret-card.revealed .hidden-only{ display:none; }
  .secret-card:not(.revealed) .revealed-only{ display:none; }

  /* ---- order screen / drag list (ticket-strip motif) ---- */
  .scale-endpoints{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted); padding:0 4px; }
  .order-list{ display:flex; flex-direction:column; gap:10px; }
  .sort-row{
    display:flex; align-items:stretch; min-height:56px; position:relative;
    background:var(--cream); border-radius:14px;
    box-shadow:0 8px 18px rgba(0,0,0,.3);
  }
  .sort-row.dragging{ box-shadow:0 18px 32px rgba(0,0,0,.5); }
  .rank-stub{
    width:46px; flex:none; position:relative;
    border-right:2px dashed rgba(36,27,61,.2);
    display:flex; align-items:center; justify-content:center;
  }
  .rank-stub::before, .rank-stub::after{
    content:''; position:absolute; width:12px; height:12px; background:var(--bg); border-radius:50%; right:-6px;
  }
  .rank-stub::before{ top:-6px; }
  .rank-stub::after{ bottom:-6px; }
  .rank-num{ font-family:var(--font-mono); font-weight:700; color:var(--amber-ink); font-size:15px; }
  .sort-name{ flex:1; display:flex; align-items:center; padding-left:14px; font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); }
  .grip{
    display:flex; align-items:center; padding:0 14px; color:var(--ink-muted); font-size:20px;
    touch-action:none; -webkit-touch-callout:none; cursor:grab; user-select:none;
  }
  .grip:active{ cursor:grabbing; color:var(--amber-ink); }
  #order-list.sorting, #order-list.sorting *{ user-select:none; }

  /* ---- result (ticket-strip + receipt) ---- */
  .result-banner{ text-align:center; padding:18px; border-radius:18px; }
  .result-banner.win{ background:rgba(74,222,128,.14); border:1.5px solid var(--mint); }
  .result-banner.lose{ background:rgba(255,107,107,.12); border:1.5px solid var(--rose); }
  .result-banner .big{ font-family:var(--font-display); font-size:21px; font-weight:900; margin-bottom:4px; }
  .result-list{ display:flex; flex-direction:column; gap:10px; }
  .result-row{
    display:flex; align-items:stretch; min-height:54px; position:relative;
    background:var(--cream); border-radius:14px;
    box-shadow:0 8px 18px rgba(0,0,0,.3);
  }
  .result-row .name{ flex:1; display:flex; align-items:center; padding-left:14px; font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); }
  .result-row .num{ display:flex; align-items:center; padding:0 16px; font-family:var(--font-mono); font-weight:700; font-size:20px; color:var(--amber-ink); }
  .connector{ display:flex; align-items:center; justify-content:center; gap:6px; padding:2px 0; font-family:var(--font-mono); font-size:11px; }
  .connector.ok{ color:var(--mint); }
  .connector.ng{ color:var(--rose); }
  .answer-panel{ display:none; }
  .answer-panel.open{
    display:block; background:var(--cream); border-radius:16px; padding:6px 16px;
    box-shadow:0 10px 22px rgba(0,0,0,.32);
  }
  .answer-row{
    display:flex; justify-content:space-between; padding:10px 2px;
    border-bottom:1px dashed rgba(36,27,61,.22); font-size:14px; color:var(--ink);
  }
  .answer-row:last-child{ border-bottom:none; }
  .answer-row .num{ font-family:var(--font-mono); color:var(--amber-ink); font-weight:700; }

  .spacer{ flex:1; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ TITLE / SETUP ============ -->
  <div class="screen active" id="screen-title">
    <div class="logo-wrap">
      <div class="mark">PASS &amp; GUESS PARTY GAME</div>
      <span class="confetti-dot" style="top:-2px; left:8%; width:9px; height:9px; background:var(--mint);"></span>
      <span class="confetti-dot" style="top:38px; right:10%; width:7px; height:7px; background:var(--rose);"></span>
      <span class="confetti-star" style="top:4px; right:20%;">✦</span>
      <span class="confetti-star" style="bottom:-4px; left:18%;">✦</span>
      <div class="logo-badge">
        <h1><span class="c1">I</span><span class="c2">T</span><span class="c3">O</span></h1>
      </div>
    </div>
    <p style="text-align:center;">スマホ1台を順番に回して遊ぶ数字ゲーム。<br>数字は言わずに、ヒントだけで小さい順に並べよう。</p>

    <div class="card-panel">
      <div class="eyebrow">人数（3〜10人）</div>
      <div class="stepper">
        <button type="button" onclick="changeCount(-1)">−</button>
        <div>
          <div class="count" id="count-display">4</div>
          <div class="count-label">人</div>
        </div>
        <button type="button" onclick="changeCount(1)">＋</button>
      </div>
    </div>

    <div class="card-panel">
      <div class="eyebrow">名前（空欄でもOK）</div>
      <div class="name-list" id="name-list"></div>
    </div>

    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="startGame()">スタート →</button>
  </div>

  <!-- ============ GLOBAL STEP BAR (shown on all screens except title) ============ -->
  <div id="global-steps">
    <div class="dots-row" id="dots-row"></div>
    <div class="step-label" id="step-label"></div>
  </div>

  <!-- ============ PASS PHASE (secret number) ============ -->
  <div class="screen" id="screen-pass">
    <div class="secret-stage">
      <div class="pass-name" id="pass-name"></div>
      <div class="secret-card" id="secret-card" onclick="revealCurrentNumber()">
        <div class="stub"><span class="stub-label">SECRET No.</span></div>
        <div class="main">
          <div class="hint hidden-only">
            <div class="icon">🔒</div>
            <div class="label">タップして数字を見る</div>
          </div>
          <div class="revealed-only secret-number" id="secret-number">--</div>
        </div>
      </div>
      <p style="text-align:center;">1〜100の中の、あなただけの数字。人に見せないでね。</p>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="pass-next-btn" onclick="nextPassPlayer()" disabled>次の人へ渡す</button>
  </div>

  <!-- ============ CLUE PHASE ============ -->
  <div class="screen" id="screen-clue">
    <div class="card-panel">
      <h2>声に出してヒントを出し合おう</h2>
      <p>数字は言わずに、たとえで伝えよう（順番は自由）。</p>
      <p style="font-family:var(--font-mono); font-size:12.5px;">例：かなり小さめ ・ 真ん中くらい ・ 100に近い</p>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="goToOrderScreen()">並び替えへ →</button>
  </div>

  <!-- ============ ORDER PHASE ============ -->
  <div class="screen" id="screen-order">
    <h2>≡をドラッグして並べ替えよう</h2>
    <div class="scale-endpoints"><span>▲ 小さい</span><span>大きい ▼</span></div>
    <div class="order-list" id="order-list"></div>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="goToResultScreen()">結果を見る</button>
  </div>

  <!-- ============ RESULT ============ -->
  <div class="screen" id="screen-result">
    <div class="result-banner" id="result-banner">
      <div class="big" id="result-headline"></div>
      <div id="result-sub" style="color:var(--text-muted); font-size:13px;"></div>
    </div>
    <div class="result-list" id="result-list"></div>
    <button class="btn btn-ghost" onclick="toggleAnswerPanel()" id="answer-toggle-btn">正しい順番を見る</button>
    <div class="answer-panel" id="answer-panel"></div>
    <div class="spacer"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goToTitleScreenFresh()">設定からやり直す</button>
      <button class="btn btn-primary" onclick="playAgainSameMembers()">もう一度</button>
    </div>
  </div>

</div>

<script>
/* ================= STATE ================= */
const state = {
  playerCount: 4,
  names: [],
  numbers: [],
  passIndex: 0,
  revealedCurrent: false,
  sequence: [],
};
let dragState = null;

/* ================= STEP BAR ================= */
const STEP_LABELS = ["数字を確認","ヒントタイム","並べ替え","結果"];
const STEP_INDEX = { 'screen-pass':0, 'screen-clue':1, 'screen-order':2, 'screen-result':3 };
function renderStepBar(current){
  const dots = document.getElementById('dots-row');
  let html = '';
  for(let i=0;i<STEP_LABELS.length;i++){
    let cls = 'dot';
    if(i < current) cls += ' done';
    else if(i === current) cls += ' active';
    html += `<div class="${cls}"></div>`;
    if(i < STEP_LABELS.length-1){
      html += `<div class="step-line${i < current ? ' done' : ''}"></div>`;
    }
  }
  dots.innerHTML = html;
  document.getElementById('step-label').textContent = `STEP ${current+1}/4 ・ ${STEP_LABELS[current]}`;
}

/* ================= HELPERS ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  const stepsBar = document.getElementById('global-steps');
  if(STEP_INDEX[id] === undefined){
    stepsBar.style.display = 'none';
  } else {
    stepsBar.style.display = 'flex';
    renderStepBar(STEP_INDEX[id]);
  }
}

/* ================= TITLE SCREEN ================= */
function syncNamesFromInputs(){
  const inputs = document.querySelectorAll('.name-input');
  if(inputs.length === 0) return;
  state.names = Array.from(inputs).map(i => i.value);
}
function changeCount(delta){
  syncNamesFromInputs();
  state.playerCount = Math.min(10, Math.max(3, state.playerCount + delta));
  while(state.names.length < state.playerCount) state.names.push('');
  state.names.length = state.playerCount;
  renderTitleScreen();
}
function renderTitleScreen(){
  document.getElementById('count-display').textContent = state.playerCount;
  const list = document.getElementById('name-list');
  list.innerHTML = '';
  for(let i=0;i<state.playerCount;i++){
    const row = document.createElement('div');
    row.className = 'name-row';
    row.innerHTML = `<span class="num">${i+1}</span>
      <input class="name-input" type="text" maxlength="10" placeholder="プレイヤー${i+1}" value="${esc(state.names[i]||'')}">`;
    list.appendChild(row);
  }
}
function startGame(){
  syncNamesFromInputs();
  state.names = state.names.map((n,i) => (n && n.trim()) ? n.trim() : `プレイヤー${i+1}`);
  assignNumbers();
  state.passIndex = 0;
  state.revealedCurrent = false;
  showScreen('screen-pass');
  renderPassScreen();
}

/* ================= NUMBER ASSIGNMENT ================= */
/* 1〜100を人数分のブロックに分け、各ブロックから1つずつ抜き出す。
   被りが起きず、数字も自然に散らばる。 */
function assignNumbers(){
  const n = state.playerCount;
  const segment = Math.floor(100 / n);
  const values = [];
  for(let i=0;i<n;i++){
    const low = i*segment + 1;
    const high = (i === n-1) ? 100 : (i+1)*segment;
    values.push(low + Math.floor(Math.random() * (high - low + 1)));
  }
  shuffle(values);
  state.numbers = values;
}

/* ================= PASS SCREEN ================= */
function renderPassScreen(){
  document.getElementById('pass-name').textContent = `${state.names[state.passIndex]} さんの番です`;
  const card = document.getElementById('secret-card');
  card.classList.remove('revealed');
  document.getElementById('secret-number').textContent = '--';
  const btn = document.getElementById('pass-next-btn');
  btn.disabled = true;
  const isLast = state.passIndex === state.playerCount - 1;
  btn.textContent = isLast ? 'ヒントタイムへ' : '次の人へ渡す';
}
function revealCurrentNumber(){
  if(state.revealedCurrent) return;
  state.revealedCurrent = true;
  document.getElementById('secret-card').classList.add('revealed');
  document.getElementById('secret-number').textContent = state.numbers[state.passIndex];
  document.getElementById('pass-next-btn').disabled = false;
}
function nextPassPlayer(){
  state.passIndex++;
  state.revealedCurrent = false;
  if(state.passIndex >= state.playerCount){
    showScreen('screen-clue');
  } else {
    renderPassScreen();
  }
}

/* ================= ORDER SCREEN (drag to reorder) ================= */
function goToOrderScreen(){
  state.sequence = shuffle(Array.from({length:state.playerCount}, (_,i) => i));
  showScreen('screen-order');
  renderOrderList();
}
function renderOrderList(){
  const container = document.getElementById('order-list');
  container.innerHTML = state.sequence.map((idx,pos) => `
    <div class="sort-row" data-idx="${idx}">
      <div class="rank-stub"><span class="rank-num">${pos+1}</span></div>
      <span class="sort-name">${esc(state.names[idx])}</span>
      <span class="grip" onpointerdown="onGripDown(event, ${idx})">≡</span>
    </div>
  `).join('');
}
function updateRanks(){
  document.querySelectorAll('#order-list .sort-row').forEach((row,i) => {
    row.querySelector('.rank-num').textContent = i+1;
  });
}
function onGripDown(e, idx){
  e.preventDefault();
  const container = document.getElementById('order-list');
  const row = container.querySelector(`.sort-row[data-idx="${idx}"]`);
  const rows = Array.from(container.children);
  const step = rows.length > 1
    ? (rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().top)
    : (row.getBoundingClientRect().height + 10);
  dragState = { row, startY: e.clientY, step: step || 60 };
  row.classList.add('dragging');
  container.classList.add('sorting');
  document.addEventListener('pointermove', onGripMove);
  document.addEventListener('pointerup', onGripUp);
  document.addEventListener('pointercancel', onGripUp);
}
function onGripMove(e){
  if(!dragState) return;
  e.preventDefault();
  const container = document.getElementById('order-list');
  const row = dragState.row;
  let deltaY = e.clientY - dragState.startY;
  let rows = Array.from(container.children);
  let idx = rows.indexOf(row);
  while(deltaY > dragState.step/2 && idx < rows.length-1){
    container.insertBefore(rows[idx+1], row);
    dragState.startY += dragState.step;
    deltaY = e.clientY - dragState.startY;
    rows = Array.from(container.children);
    idx = rows.indexOf(row);
  }
  while(deltaY < -dragState.step/2 && idx > 0){
    container.insertBefore(row, rows[idx-1]);
    dragState.startY -= dragState.step;
    deltaY = e.clientY - dragState.startY;
    rows = Array.from(container.children);
    idx = rows.indexOf(row);
  }
  row.style.transform = `translateY(${deltaY}px)`;
  updateRanks();
}
function onGripUp(){
  if(!dragState) return;
  dragState.row.classList.remove('dragging');
  dragState.row.style.transform = '';
  document.getElementById('order-list').classList.remove('sorting');
  document.removeEventListener('pointermove', onGripMove);
  document.removeEventListener('pointerup', onGripUp);
  document.removeEventListener('pointercancel', onGripUp);
  state.sequence = Array.from(document.getElementById('order-list').children).map(r => parseInt(r.dataset.idx,10));
  dragState = null;
}

/* ================= RESULT SCREEN ================= */
function goToResultScreen(){
  showScreen('screen-result');
  renderResultScreen();
}
function renderResultScreen(){
  const seq = state.sequence;
  const list = document.getElementById('result-list');
  let html = '';
  let mistakes = 0;
  for(let i=0;i<seq.length;i++){
    const idx = seq[i];
    html += `
      <div class="result-row">
        <div class="rank-stub"><span class="rank-num">${i+1}</span></div>
        <span class="name">${esc(state.names[idx])}</span>
        <span class="num">${state.numbers[idx]}</span>
      </div>`;
    if(i < seq.length-1){
      const ok = state.numbers[seq[i]] < state.numbers[seq[i+1]];
      if(!ok) mistakes++;
      html += `<div class="connector ${ok?'ok':'ng'}">${ok ? '↓ OK' : '↓ NG'}</div>`;
    }
  }
  list.innerHTML = html;

  const banner = document.getElementById('result-banner');
  const headline = document.getElementById('result-headline');
  const sub = document.getElementById('result-sub');
  if(mistakes === 0){
    banner.className = 'result-banner win';
    headline.textContent = '🎉 クリア！';
    sub.textContent = '順番ぴったり！';
  } else {
    banner.className = 'result-banner lose';
    headline.textContent = `❌ ${mistakes}箇所ミス`;
    sub.textContent = '↓ NG の場所が逆になっていました。';
  }

  const ansPanel = document.getElementById('answer-panel');
  ansPanel.classList.remove('open');
  document.getElementById('answer-toggle-btn').textContent = '正しい順番を見る';
  const sortedIdx = [...Array(state.playerCount).keys()].sort((a,b) => state.numbers[a]-state.numbers[b]);
  ansPanel.innerHTML = sortedIdx.map(idx =>
    `<div class="answer-row"><span>${esc(state.names[idx])}</span><span class="num">${state.numbers[idx]}</span></div>`
  ).join('');
}
function toggleAnswerPanel(){
  const panel = document.getElementById('answer-panel');
  const btn = document.getElementById('answer-toggle-btn');
  panel.classList.toggle('open');
  btn.textContent = panel.classList.contains('open') ? '隠す' : '正しい順番を見る';
}

/* ================= REPLAY / RESET ================= */
function playAgainSameMembers(){
  assignNumbers();
  state.passIndex = 0;
  state.revealedCurrent = false;
  state.sequence = [];
  showScreen('screen-pass');
  renderPassScreen();
}
function goToTitleScreenFresh(){
  state.playerCount = 4;
  state.names = [];
  state.numbers = [];
  state.passIndex = 0;
  state.revealedCurrent = false;
  state.sequence = [];
  renderTitleScreen();
  showScreen('screen-title');
}

/* ================= INIT ================= */
renderTitleScreen();
</script>
